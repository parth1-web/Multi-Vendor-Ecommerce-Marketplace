name: Repository

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No committed secrets
        shell: bash
        run: |
          fail=0
          # .env must never be tracked
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is committed"; fail=1
          fi
          # JWT-looking literals
          if git grep -nIE 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' -- . ; then
            echo "::error::Possible committed JWT"; fail=1
          fi
          # hard-coded signing keys
          if git grep -nIE 'Jwt__Key *= *"[A-Za-z0-9+/=]{20,}"' -- . ; then
            echo "::error::Possible hard-coded JWT key"; fail=1
          fi
          exit $fail

      - name: Commit message convention
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          allowed='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          while read -r sha; do
            subject=$(git log -1 --pretty=%s "$sha")
            if ! echo "$subject" | grep -Eq "$allowed"; then
              echo "::error::Commit $sha does not follow conventional commits: $subject"
              exit 1
            fi
          done < <(git rev-list "${{ github.event.pull_request.base.sha }}.."${{ github.event.pull_request.head.sha }}")

      - name: Documentation links resolve
        shell: bash
        run: |
          # Relative links resolve against the file that contains them — the same rule
          # markdown renderers (including GitHub's) use — not against the repo root.
          # Resolving from the root flags correct links (e.g. docs/api/../architecture)
          # while letting genuinely broken ones through unnoticed. Absolute URLs and
          # site-root paths are out of scope: there is no repo file they could point to.
          # Dependency docs are excluded: vendored markdown is not ours to fix.
          fail=0
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            while IFS= read -r link; do
              target="${link%%#*}"
              [ -z "$target" ] && continue
              case "$target" in
                http://*|https://*|mailto:*|/*) continue ;;
              esac
              if [ ! -e "$dir/$target" ]; then
                echo "::error::Broken relative link in $file: $link"
                fail=1
              fi
            done < <(grep -hoE '\]\((\.{0,2}/[^)#]+)(#[^)]*)?\)' -- "$file" | sed -E 's/^\]\(//;s/\)$//')
          done < <(find . -name '*.md' -not -path '*/node_modules/*' -print0)
          exit $fail
