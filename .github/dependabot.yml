name: Dependabot

version: 2

updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dotnet-minor:
        update-types:
          - minor
          - patch
    labels: [dependencies, backend]
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: npm
    directory: /frontend/marketplace-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types:
          - minor
          - patch
    labels: [dependencies, frontend]
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci(deps)'
